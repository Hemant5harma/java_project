name: CICD Pipeline

on:
  push:
    branches: [ "aws_beanstalk" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Package JAR and Procfile
        run: |
          cp target/database_service_project-0.0.2.jar app.jar
          zip source.zip app.jar Procfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Create S3 bucket if not exists
        run: |
          if ! aws s3 ls "s3://my-govind-bucket2001" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "Bucket exists."
          else
            aws s3 mb s3://my-govind-bucket2001 --region ap-south-1
          fi

      - name: Upload to S3
        run: aws s3 cp source.zip s3://my-govind-bucket2001/source.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name beanstalk \
            --version-label v-${{ github.run_number }} \
            --source-bundle S3Bucket=my-govind-bucket2001,S3Key=source.zip

          aws elasticbeanstalk update-environment \
            --environment-name beanstalk-env \
            --version-label v-${{ github.run_number }}










