name: CICD Pipeline

on:
  push:
    branches: [ "aws_beanstalk" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package

    - uses: actions/upload-artifact@v4
      with:
        name: Boardgame 
        path: target/*.jar

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

    - name: install eb cli
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv
        python3 -m venv ebcli-venv
        source ebcli-venv/bin/activate
        pip install --upgrade pip
        pip install awsebcli
        echo "$(pwd)/ebcli-venv/bin" >> $GITHUB_PATH

    - name: init eb
      run: eb init -p corretto-21 java-beanstalk-1 --region ap-south-1

    - name: create env
      run: eb create java-pro-env-1

    - name: Deploy to Elastic Beanstalk
      run: eb deploy








