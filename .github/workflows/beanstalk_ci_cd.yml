name: CICD Pipeline

on:
  push:
    branches: [ "aws_beanstalk" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Install EB CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv
        python3 -m venv ebcli-venv
        source ebcli-venv/bin/activate
        pip install --upgrade pip
        pip install awsebcli
        echo "$(pwd)/ebcli-venv/bin" >> $GITHUB_PATH

    - name: Initialize Elastic Beanstalk
      run: eb init -p corretto-21 beanstalk-java --region ap-south-1

    - name: Select or create EB environment
      run: eb create java-env-new

    - name: Copy JAR to root (optional, if your Procfile expects it in root)
      run: cp target/database_service_project-0.0.2.jar .

    - name: Prepare deployment bundle
      run: zip deploy.zip database_service_project-0.0.2.jar Procfile

    - name: Deploy to Elastic Beanstalk
      run: |
        source ebcli-venv/bin/activate
        eb deploy --staged --label "ci-$(date +%s)"








